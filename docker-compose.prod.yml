services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoning}
      POSTGRES_DB: ${POSTGRES_DB:-zoning_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zoning} -d ${POSTGRES_DB:-zoning_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://zoning:zoning@db:5432/zoning_dev}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${PUBLIC_HOSTNAME:-localhost}}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
